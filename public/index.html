<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07070a" />
  <title>Plan Online · 게임 선택</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/common.css" />
  <style>
    .dash { max-width: 1040px; margin: 0 auto; padding: 0 16px calc(32px + var(--safe-b)); }
    .dash-top { display: flex; align-items: center; justify-content: space-between; padding: calc(14px + env(safe-area-inset-top, 0px)) 0 14px; }
    .dash-head { margin: 18px 0 18px; }
    .dash-head .kicker { font-family: var(--display); color: var(--red); letter-spacing: .2em; font-size: 13px; }
    .dash-head h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 9vw, 52px); line-height: 1.05; margin: 6px 0 0; letter-spacing: .01em; }
    .dash-head h1 span { color: var(--red); text-shadow: 0 0 28px var(--red-glow); }

    .games { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .games { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 960px) { .games { grid-template-columns: repeat(3, 1fr); } }

    .gc {
      position: relative; overflow: hidden; border-radius: 22px; min-height: 168px;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 18px;
      border: 1px solid var(--stroke); isolation: isolate;
      transition: transform .12s, border-color .2s, box-shadow .2s;
    }
    .gc.live {
      background:
        radial-gradient(90% 120% at 100% 0%, rgba(255,46,77,.5) 0%, transparent 55%),
        linear-gradient(160deg, #24070d 0%, #0d0d13 70%);
      border-color: rgba(255,46,77,.35);
      box-shadow: 0 20px 50px -20px rgba(255,46,77,.45);
      min-height: 220px;
    }
    .gc.live:active { transform: scale(.985); }
    @media (hover: hover) { .gc.live:hover { border-color: rgba(255,46,77,.7); transform: translateY(-2px); } }
    .gc-art { position: absolute; right: -36px; top: -30px; width: 210px; height: 210px; z-index: -1; opacity: .95; }
    .gc-art .spin { transform-origin: 100px 100px; animation: spin 24s linear infinite; }
    .gc-art.bingo { right: -26px; top: -20px; width: 190px; height: 190px; }
    .gc-art .tilt { transform-origin: 100px 100px; transform: rotate(12deg); }
    .gc.live.auction-bingo {
      background: radial-gradient(90% 120% at 100% 0%, rgba(77,163,255,.42) 0%, transparent 55%), linear-gradient(160deg, #081427 0%, #0d0d13 70%);
      border-color: rgba(77,163,255,.35); box-shadow: 0 20px 50px -20px rgba(77,163,255,.4);
    }
    .gc.live.auction-bingo .gc-play { background: linear-gradient(180deg, #5cb0ff, #2a7de0); box-shadow: 0 8px 22px -4px rgba(77,163,255,.6); }
    .gc.live.auction-bingo .chip-red { background: var(--blue-soft); color: var(--blue); border-color: rgba(77,163,255,.35); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .gc-no { font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: .1em; }
    .gc h2 { font-family: var(--display); font-weight: 400; font-size: 32px; margin: 2px 0 4px; letter-spacing: .01em; line-height: 1.1; }
    .gc p { margin: 0 0 12px; color: var(--text-2); font-size: 14px; }
    .gc.live p { max-width: 60%; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
    .gc-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .gc-meta { display: flex; gap: 6px; flex-wrap: wrap; }
    .gc-play {
      width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; flex: none;
      background: linear-gradient(180deg, #ff4560, #e01535); box-shadow: 0 8px 22px -4px var(--red-glow);
    }
    .gc-play svg { width: 22px; height: 22px; margin-left: 3px; }
    .gc.soon { background: repeating-linear-gradient(135deg, rgba(255,255,255,.02) 0 12px, transparent 12px 24px), var(--bg-2); border-style: dashed; color: var(--text-3); align-items: flex-start; justify-content: center; }
    .gc.soon h2 { font-size: 22px; color: var(--text-3); }
    .gc.soon .lock { font-size: 22px; margin-bottom: 4px; opacity: .5; }

    .dash-foot { margin-top: 28px; color: var(--text-3); font-size: 12px; text-align: center; }
  </style>
  <script src="js/inapp.js"></script>
</head>
<body>
  <div class="dash">
    <header class="dash-top">
      <a class="logo" href="./"><span class="logo-mark">P</span>PLAN<b>ONLINE</b></a>
    </header>

    <div class="dash-head">
      <div class="kicker">SELECT GAME</div>
      <h1>오늘의 <span>게임</span>을<br />골라라</h1>
    </div>

    <div class="games" id="games"></div>
    <div class="dash-foot">비공식 팬 프로젝트 · 데블스 플랜 3 게임 룰 기반</div>
  </div>

  <script src="js/games.js"></script>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const art = `<svg class="gc-art" viewBox="0 0 200 200" aria-hidden="true">
      <defs><radialGradient id="cy" cx="40%" cy="35%"><stop offset="0" stop-color="#4a4a58"/><stop offset="1" stop-color="#1c1c24"/></radialGradient></defs>
      <g class="spin">
        <circle cx="100" cy="100" r="86" fill="url(#cy)" stroke="#5c5c6c" stroke-width="3"/>
        ${[0, 1, 2, 3, 4, 5].map((i) => {
          const a = ((i * 60 - 90) * Math.PI) / 180, x = 100 + 52 * Math.cos(a), y = 100 + 52 * Math.sin(a);
          const live = i === 1 || i === 4;
          return `<circle cx="${x}" cy="${y}" r="20" fill="${live ? '#ff2e4d' : '#0b0b10'}" stroke="${live ? '#ff8a9a' : '#3a3a48'}" stroke-width="3"/>` +
            (live ? `<circle cx="${x}" cy="${y}" r="8" fill="#ffc542"/>` : '');
        }).join('')}
        <circle cx="100" cy="100" r="12" fill="#0b0b10" stroke="#3a3a48" stroke-width="3"/>
      </g></svg>`;
    const SH = {
      circle: '<circle cx="12" cy="12" r="8.2"/>',
      triangle: '<path d="M12 3.6 20.8 19.4H3.2z"/>',
      star: '<path d="M12 2.6l2.75 5.75 6.3.85-4.6 4.35 1.15 6.25L12 16.8l-5.6 3 1.15-6.25-4.6-4.35 6.3-.85z"/>',
    };
    const COL = { circle: '#4da3ff', triangle: '#2ee6a0', star: '#ffc542' };
    const BOARD = ['triangle', 'circle', 'triangle', 'circle', 'star', 'circle', 'star', 'circle', 'triangle'];
    const bingoArt = `<svg class="gc-art bingo" viewBox="0 0 200 200" aria-hidden="true"><g class="tilt">${BOARD.map((s, i) => {
      const x = 22 + (i % 3) * 54, y = 22 + Math.floor(i / 3) * 54, on = [2, 4, 6, 0, 8].includes(i);
      return `<rect x="${x}" y="${y}" width="48" height="48" rx="11" fill="${on ? 'rgba(255,255,255,.07)' : '#101016'}" stroke="${on ? COL[s] : '#2e2e3a'}" stroke-width="2.5"/>` +
        `<g transform="translate(${x + 8} ${y + 8}) scale(1.33)" fill="${on ? COL[s] : 'none'}" stroke="${COL[s]}" stroke-width="2.2" stroke-linejoin="round" opacity="${on ? 1 : .5}">${SH[s]}</g>`;
    }).join('')}<line x1="160" y1="40" x2="40" y2="160" stroke="#ff2e4d" stroke-width="7" stroke-linecap="round"/></g></svg>`;
    const play = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';

    document.getElementById('games').innerHTML = window.GAMES.map((g, i) => {
      const no = `GAME ${String(i + 1).padStart(2, '0')}`;
      if (g.status !== 'live') {
        return `<div class="gc soon"><div class="lock">🔒</div><div class="gc-no">${no}</div><h2>${esc(g.title)}</h2></div>`;
      }
      return `<a class="gc live ${g.id}" href="${g.url}">
        ${g.id === 'russian-roulette' ? art : g.id === 'auction-bingo' ? bingoArt : ''}
        <div class="gc-no">${no}</div>
        <h2>${esc(g.title)}</h2>
        <p>${esc(g.summary)}</p>
        <div class="gc-foot">
          <div class="gc-meta"><span class="chip">👥 ${esc(g.players)}</span><span class="chip">⏱ ${esc(g.time)}</span>${(g.tags || []).map((t) => `<span class="chip chip-red">${esc(t)}</span>`).join('')}</div>
          <span class="gc-play">${play}</span>
        </div>
      </a>`;
    }).join('');
  </script>
</body>
</html>
